services:
  nginx:
    # Pinned to the patched stable release (CVE-2026-15176/93479/95101/97629/97205).
    # Bump deliberately; never float back to nginx:alpine.
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/logs:/var/log/nginx
      - ../../nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - open-webui
      - docling
    restart: unless-stopped
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
