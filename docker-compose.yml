services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
      - open-webui-ollama:/root/.ollama
    environment:
      - USE_OLLAMA_DOCKER=true
      - USE_CUDA_DOCKER=true
      - OLLAMA_BASE_URL=/ollama
      - DOCLING_DO_PICTURE_DESCRIPTION=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spark-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - docling
      - llamacpp

  docling:
    image: ghcr.io/docling-project/docling-serve-cu130:main
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - docling-models:/root/.cache/docling
      - docling-easyocr:/root/.EasyOCR
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
      - DOCLING_SERVE_MAX_SYNC_WAIT=3600
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=2
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - UVICORN_WORKERS=1
      - CUDA_VISIBLE_DEVICES=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spark-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  llamacpp:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./logs:/logs
    environment:
      - LLAMA_SERVER_PATH=${LLAMA_SERVER_PATH:-/llama-server}
      - MODEL_PATH=${MODEL_PATH:-/models/granite-vision-3.3-2b/granite-vision-3.3-2b-Q8_0.gguf}
      - MM_PROJ_PATH=${MM_PROJ_PATH:-/models/granite-vision-3.3-2b/mmproj-model-f16.gguf}
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - spark-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - open-webui
      - docling
      - llamacpp
    restart: unless-stopped
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge

volumes:
  open-webui:
  open-webui-ollama:
  docling-models:
  docling-easyocr:
