# Compose stack split by domain. Networks and volumes are defined in compose/base.yml
# so all services reference the same spark-network and named volumes.
#
# Usage (unchanged):
#   docker compose up -d
#   docker compose build
#   docker compose logs -f <service>
#
# Include order: base first (defines network + volumes), then by domain:
#   llm → docling → web → sidecars

include:
  - compose/base.yml
  - compose/llm/llamacpp-vision.yml
  - compose/llm/llamacpp-llama.yml
  - compose/llm/llamacpp-qwen.yml
  - compose/docling/docling.yml
  - compose/web/ollama.yml
  - compose/web/open-webui.yml
  - compose/web/nginx.yml
  - compose/sidecars/content-extraction.yml
  - compose/sidecars/excel-sidecar.yml
